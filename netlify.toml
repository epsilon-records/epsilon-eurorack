# Static files only; no build step. Netlify site and DNS are configured by the Oracle.
[build]
  publish = "site"
  command = ""
  # Netlify skips when ignore returns 0. Deploy previews require an explicit branch suffix.
  ignore = "[ \"$CONTEXT\" = \"deploy-preview\" ] && [ \"${HEAD%-preview}\" = \"$HEAD\" ]"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/modules/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
